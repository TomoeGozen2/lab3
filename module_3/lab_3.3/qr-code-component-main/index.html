<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body class="flex flex-col justify-center items-center min-h-screen  bg-sky-200">


  <div class="flex flex-col justify-center items-center text-center w-[20%] h-[50%] bg-white 
  rounded-md mt-[5px]">
    <img class="w-[80%] rounded-md pt-5" src="images/image-qr-code.png">
    <h2 class="text-2x1 font-bold">
      Improve your front-end skills by building projects
    </h2>
    <p class="pl-5 pr-5 text-slate-500">
      Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
    </p>
  </div>




  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
